name: verification-final

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Commit to verify against the approved specification on main
        required: true
        type: string

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: Install the pinned Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Use the approved auditor and baseline
        run: |
          git fetch origin main
          baseline=$(git rev-parse origin/main)
          approved=$(mktemp -d)
          git worktree add --detach "$approved" "$baseline"
          test -f "$approved/scripts/verification.py"
          python3 "$approved/scripts/verification.py" final --root "$GITHUB_WORKSPACE" --baseline "$baseline"

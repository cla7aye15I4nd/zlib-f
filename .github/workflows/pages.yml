name: Interactive essay

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - ZlibF/**
      - ZlibF.lean
      - tests/audit/public-api.json
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - site/**
      - docs/**
      - ZlibF/**
      - ZlibF.lean
      - tests/audit/public-api.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: essay-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the Markdown renderer
        run: python3 -m pip install -r site/requirements.txt
      - name: Build both languages
        run: python3 site/build.py
      - name: Check assets and bilingual navigation
        run: python3 site/check.py
      - name: Test teaching models
        run: node --test site/tests/*.test.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish the independent project site
        id: deployment
        uses: actions/deploy-pages@v4

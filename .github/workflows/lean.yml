name: lean

on:
  push:
    branches: [main, dev]
  pull_request:
  # The acceptance suite (audit, proof mutants, differential tests) runs every
  # night on main and on request. It does not gate ordinary merges.
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Everything must build. This job is the one that has to be green on every push.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: ./.github/actions/lean-environment
        id: lean

      - name: Reuse unchanged module outputs across runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake
            tests/.lake
          key: lean-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.lean.outputs.abi }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'tests/lakefile.toml') }}-${{ hashFiles('ZlibF.lean', 'ZlibF/**/*.lean', 'tests/**/*.lean') }}
          restore-keys: |
            lean-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.lean.outputs.abi }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'tests/lakefile.toml') }}-

      - name: Build the library once
        run: lake build ZlibF zlibf-audit zlibf-span zlibf-proof-replay

      - name: Build the differential drivers once
        working-directory: tests
        run: |
          cmp ../lean-toolchain lean-toolchain
          mapfile -t names < <(grep -v '^[[:space:]]*\(#\|$\)' list.txt)
          targets=()
          for name in "${names[@]}"; do targets+=("difftest_$name"); done
          lake build "${targets[@]}"

      - name: Forbidden constructs
        run: |
          if grep -rnE '\b(native_decide|bv_decide|implemented_by)\b|^\s*axiom\b|^\s*(@\[[^]]*\]\s*)?(private\s+|protected\s+|noncomputable\s+)*((partial|unsafe)\s+(def|instance|theorem|abbrev|structure|inductive)\b|opaque\s+[A-Za-z_.]+\s*[:(\[{])|@\[[^]]*\bextern\b' ZlibF.lean ZlibF; then
            echo "forbidden construct found"; exit 1
          fi

      - name: Patches apply to the pinned zlib
        run: |
          cp -r zlib /tmp/zlib-verified
          rm -rf /tmp/zlib-verified/.git
          shopt -s nullglob
          for p in patches/*.patch; do (cd /tmp/zlib-verified && git apply "$GITHUB_WORKSPACE/$p"); done

      - name: Publish the immutable build for this run
        run: python3 scripts/ci-build-artifact.py pack "$RUNNER_TEMP/lean-build.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lean-build
          path: ${{ runner.temp }}/lean-build.tar.gz
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  # The final requirement of the project: no sorry anywhere. A work in progress may fail this job; a result may not
  # be reported as final while it fails.
  no-sorry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No sorry
        run: scripts/check-sorry.sh

  # The audit: axioms, doc strings and the goals.
  audit_core:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - uses: ./.github/actions/lean-environment
        with:
          library: 'true'

      - name: Audit
        env:
          ZLIBF_REQUIRE_PREBUILT: '1'
        run: python3 scripts/verification.py specs

      - name: Auditor acceptance and rejection tests
        run: |
          python3 tests/verification/test_audit.py
          python3 -O tests/verification/test_audit.py
          python3 tests/verification/test_public_mutants.py
          python3 -O tests/verification/test_public_mutants.py
          python3 tests/verification/test_harness.py
          python3 tests/verification/test_audit_shards.py
          python3 -O tests/verification/test_audit_shards.py
          python3 tests/verification/test_ci_build.py
          python3 -O tests/verification/test_ci_build.py
          python3 tests/verification/test-proof-progress.py
          python3 -O tests/verification/test-proof-progress.py
          python3 scripts/proof-progress.py --check

  audit_selftest:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - uses: ./.github/actions/lean-environment

      - name: Audit self test (every assigned cheat must be rejected)
        env:
          AUDIT_SHARD_COUNT: '2'
          AUDIT_SHARD_INDEX: ${{ matrix.shard }}
        run: bash tests/audit/selftest.sh

  audit_mutants:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - uses: ./.github/actions/lean-environment
        with:
          library: 'true'

      - name: Model and public function proof mutants
        env:
          ZLIBF_REQUIRE_PREBUILT: '1'
        run: python3 scripts/verification.py mutants --shard-count 4 --shard-index ${{ matrix.shard }}

  # Keep audit as the required status. Failure, cancellation or skipping in any
  # worker must prevent this status from passing.
  audit:
    needs: [audit_core, audit_selftest, audit_mutants]
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every audit stage
        env:
          AUDIT_CORE_RESULT: ${{ needs.audit_core.result }}
          AUDIT_SELFTEST_RESULT: ${{ needs.audit_selftest.result }}
          AUDIT_MUTANTS_RESULT: ${{ needs.audit_mutants.result }}
        run: test "$AUDIT_CORE_RESULT/$AUDIT_SELFTEST_RESULT/$AUDIT_MUTANTS_RESULT" = "success/success/success"

  diff_core:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true    # zlib/ at the pinned commit; it is copied, never modified

      - name: Install a C compiler and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential patch python3

      - uses: ./.github/actions/lean-environment
        with:
          library: 'true'

      # tests/ is a separate Lake project that requires the parent project ZlibF by path, so the
      # drivers call the same translation the proofs are about. The lean-toolchain of tests/ is a
      # copy of the root one; keep them equal.
      - name: Toolchains agree
        run: cmp lean-toolchain tests/lean-toolchain

      # Copies zlib/ to tests/build/zlib, applies patches/*.patch there in name order, and builds
      # libz.a (./configure --static; make libz.a). The submodule is not modified.
      - name: Build the patched zlib and the Lean drivers, run the differential test
        run: ZLIB_SRC="$GITHUB_WORKSPACE/zlib" bash tests/run.sh

      # Same test with the C side built with AddressSanitizer and UBSan: the C reference itself
      # must be free of memory errors and undefined behaviour on every input.
      - name: Differential test, C side under ASan and UBSan
        run: SAN=1 ZLIB_SRC="$GITHUB_WORKSPACE/zlib" bash tests/run.sh


  diff_harness:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: ./.github/actions/lean-environment
        with:
          library: 'true'
      - name: Harness mutation check (all original cases, eight independent runners)
        env:
          MUTATION_SHARD_COUNT: '8'
          MUTATION_SHARD_INDEX: ${{ matrix.shard }}
        run: ZLIB_SRC="$GITHUB_WORKSPACE/zlib" bash tests/selftest.sh

  # Required status: a failed, skipped or cancelled worker cannot pass.
  difftest:
    needs: [diff_core, diff_harness]
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every differential stage
        env:
          CORE_RESULT: ${{ needs.diff_core.result }}
          HARNESS_RESULT: ${{ needs.diff_harness.result }}
        run: test "$CORE_RESULT/$HARNESS_RESULT" = "success/success"

name: lean

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  # Everything must build. This job is the one that has to be green on every push.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build
        run: lake build ZlibF

      - name: Forbidden constructs
        run: |
          if grep -rnE '\b(native_decide|bv_decide|implemented_by)\b|^\s*axiom\b' ZlibF.lean ZlibF; then
            echo "forbidden construct found"; exit 1
          fi

      - name: Patches apply to the pinned zlib
        run: |
          cp -r zlib /tmp/zlib-verified
          rm -rf /tmp/zlib-verified/.git
          for p in patches/*.patch; do (cd /tmp/zlib-verified && git apply "$GITHUB_WORKSPACE/$p"); done

  # The final requirement of the project: no sorry anywhere. A work in progress may fail this job; a result may not
  # be reported as final while it fails.
  no-sorry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: No sorry
        run: scripts/check-sorry.sh

  # The audit: axioms, doc strings, the locks on trusted definitions and statements, the goals.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build
        run: lake build ZlibF

      - name: Audit
        run: |
          # The audit program is taken from main, so that a branch cannot weaken its own audit.
          git fetch --depth=1 origin main || true
          if git cat-file -e origin/main:tests/audit/Audit.lean 2>/dev/null; then
            git show origin/main:tests/audit/Audit.lean > /tmp/Audit.lean
            echo "using the audit program from main"
          else
            cp tests/audit/Audit.lean /tmp/Audit.lean
            echo "::warning::no audit program on main yet: using the one of this branch"
          fi
          lake env lean --run /tmp/Audit.lean tests/audit/theorems.txt tests/audit/goals.txt > /tmp/report.txt
          grep '^trusted ' /tmp/report.txt > /tmp/trusted.now
          grep '^statement ' /tmp/report.txt > /tmp/statements.now
          diff -u tests/audit/trusted.lock /tmp/trusted.now || { echo "::error::a trusted definition changed: update tests/audit/trusted.lock in a reviewed change"; exit 1; }
          diff -u tests/audit/statements.lock /tmp/statements.now || { echo "::error::a theorem statement changed: update tests/audit/statements.lock in a reviewed change"; exit 1; }

      - name: Audit self test (every cheat sample must be rejected)
        run: bash tests/audit/selftest.sh

      - name: Protected paths
        run: |
          git fetch --depth=1 origin main || true
          if git rev-parse origin/main >/dev/null 2>&1; then
            changed=$(git diff --name-only origin/main...HEAD -- tests/audit .github scripts ZlibF/Runtime lakefile.toml lean-toolchain patches AGENTS.md docs/spec || true)
            if [ -n "$changed" ]; then echo "::warning::protected paths changed, a human must review:"; echo "$changed"; fi
          fi

  difftest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true    # zlib/ at the pinned commit; it is copied, never modified

      - name: Install a C compiler and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential patch python3

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # tests/ is a separate Lake project that requires the parent project ZlibF by path, so the
      # drivers call the same translation the proofs are about. The lean-toolchain of tests/ is a
      # copy of the root one; keep them equal.
      - name: Toolchains agree
        run: cmp lean-toolchain tests/lean-toolchain

      # Copies zlib/ to tests/build/zlib, applies patches/*.patch there in name order, and builds
      # libz.a (./configure --static; make libz.a). The submodule is not modified.
      - name: Build the patched zlib and the Lean drivers, run the differential test
        run: ZLIB_SRC="$GITHUB_WORKSPACE/zlib" bash tests/run.sh

      # Same test with the C side built with AddressSanitizer and UBSan: the C reference itself
      # must be free of memory errors and undefined behaviour on every input.
      - name: Differential test, C side under ASan and UBSan
        run: SAN=1 ZLIB_SRC="$GITHUB_WORKSPACE/zlib" bash tests/run.sh

      # Mutates a copy of the Lean translation and checks that run.sh reports every mutation.
      - name: Harness mutation check
        run: ZLIB_BUILD="$GITHUB_WORKSPACE/tests/build/zlib" bash tests/selftest.sh

name: lean

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Everything must build. This job is the one that has to be green on every push.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build
        run: lake build ZlibF

      - name: Forbidden constructs
        run: |
          if grep -rnE '\b(native_decide|bv_decide|implemented_by)\b|^\s*axiom\b' ZlibF.lean ZlibF; then
            echo "forbidden construct found"; exit 1
          fi

      - name: Patches apply to the pinned zlib
        run: |
          cp -r zlib /tmp/zlib-verified
          rm -rf /tmp/zlib-verified/.git
          shopt -s nullglob
          for p in patches/*.patch; do (cd /tmp/zlib-verified && git apply "$GITHUB_WORKSPACE/$p"); done

  # The final requirement of the project: no sorry anywhere. A work in progress may fail this job; a result may not
  # be reported as final while it fails.
  no-sorry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No sorry
        run: scripts/check-sorry.sh

  # The audit: axioms, doc strings, the locks on trusted definitions and statements, the goals.
  audit_core:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build
        run: lake build ZlibF

      - name: Audit
        run: |
          # This first baseline needs independent review. Subsequent runs use main's auditor.
          git fetch --depth=1 origin main
          if git cat-file -e origin/main:scripts/verification.py 2>/dev/null; then
            approved=$(mktemp -d)
            git worktree add --detach "$approved" origin/main
            python3 "$approved/scripts/verification.py" specs --root "$GITHUB_WORKSPACE"
          else
            echo "::warning::bootstrap auditor: independent review is required before approving this baseline"
            python3 scripts/verification.py specs
          fi

      - name: Auditor acceptance and rejection tests
        run: |
          python3 tests/verification/test_audit.py
          python3 -O tests/verification/test_audit.py
          python3 tests/verification/test_public_mutants.py
          python3 -O tests/verification/test_public_mutants.py
          python3 tests/verification/test_harness.py

      - name: Protected paths
        run: |
          git fetch --depth=1 origin main || true
          if git rev-parse origin/main >/dev/null 2>&1; then
            changed=$(git diff --name-only origin/main...HEAD -- tests/audit .github scripts ZlibF/Runtime ZlibF/Zlib ZlibF/Spec ZlibF.lean zlib .gitmodules .gitignore lakefile.toml lean-toolchain patches AGENTS.md docs/api docs/format docs/README.md docs/design/api-model.md docs/design/internal-contracts.md docs/checking/goals.md docs/checking/contract-review.md docs/safety.md docs/trusted-base.md docs/deviations.md docs/anti-cheating.md || true)
            if [ -n "$changed" ]; then echo "::warning::protected paths changed, a human must review:"; echo "$changed"; fi
          fi

  audit_selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build
        run: lake build ZlibF

      - name: Audit self test (every cheat sample must be rejected)
        run: bash tests/audit/selftest.sh

  audit_mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build
        run: lake build ZlibF

      - name: Model and public function proof mutants
        run: python3 scripts/verification.py mutants

  # Keep audit as the required status. Failure, cancellation or skipping in any
  # worker must prevent this status from passing.
  audit:
    needs: [audit_core, audit_selftest, audit_mutants]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every audit stage
        env:
          AUDIT_CORE_RESULT: ${{ needs.audit_core.result }}
          AUDIT_SELFTEST_RESULT: ${{ needs.audit_selftest.result }}
          AUDIT_MUTANTS_RESULT: ${{ needs.audit_mutants.result }}
        run: test "$AUDIT_CORE_RESULT/$AUDIT_SELFTEST_RESULT/$AUDIT_MUTANTS_RESULT" = "success/success/success"

  difftest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true    # zlib/ at the pinned commit; it is copied, never modified

      - name: Install a C compiler and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential patch python3

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # tests/ is a separate Lake project that requires the parent project ZlibF by path, so the
      # drivers call the same translation the proofs are about. The lean-toolchain of tests/ is a
      # copy of the root one; keep them equal.
      - name: Toolchains agree
        run: cmp lean-toolchain tests/lean-toolchain

      # Copies zlib/ to tests/build/zlib, applies patches/*.patch there in name order, and builds
      # libz.a (./configure --static; make libz.a). The submodule is not modified.
      - name: Build the patched zlib and the Lean drivers, run the differential test
        run: ZLIB_SRC="$GITHUB_WORKSPACE/zlib" bash tests/run.sh

      # Same test with the C side built with AddressSanitizer and UBSan: the C reference itself
      # must be free of memory errors and undefined behaviour on every input.
      - name: Differential test, C side under ASan and UBSan
        run: SAN=1 ZLIB_SRC="$GITHUB_WORKSPACE/zlib" bash tests/run.sh

      # Mutates a copy of the Lean translation and checks that run.sh reports every mutation.
      - name: Harness mutation check
        run: ZLIB_BUILD="$GITHUB_WORKSPACE/tests/build/zlib" bash tests/selftest-parallel.sh

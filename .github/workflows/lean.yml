name: lean

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build
        run: lake build ZlibF

      - name: Forbidden constructs
        run: |
          if grep -rnE '\b(native_decide|bv_decide|implemented_by)\b|^\s*axiom\b' ZlibF.lean ZlibF; then
            echo "forbidden construct found"; exit 1
          fi

      - name: Sorry ratchet
        run: scripts/check-sorry.sh

      - name: Axiom gate
        run: lake env lean Check.lean

      - name: Patches apply to the pinned zlib
        run: |
          cp -r zlib /tmp/zlib-verified
          rm -rf /tmp/zlib-verified/.git
          for p in patches/*.patch; do (cd /tmp/zlib-verified && git apply "$GITHUB_WORKSPACE/$p"); done

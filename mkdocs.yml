site_name: zlib-f
site_description: Safety and functional verification of the zlib implementation
site_url: https://www.dataisland.org/zlib-f/
repo_url: https://github.com/cla7aye15I4nd/zlib-f
repo_name: zlib-f
edit_uri: edit/main/docs/
strict: true
validation:
  links:
    anchors: warn
exclude_docs: |
  /README*.md
hooks:
  - website/hooks.py
theme:
  name: material
  font: false
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
plugins:
  - search:
      # jieba segments Chinese at build time; use the shared browser tokenizer.
      lang: en
  - i18n:
      docs_structure: suffix
      reconfigure_search: false
      languages:
        - locale: en
          name: English
          default: true
        - locale: zh
          name: 简体中文
          site_description: zlib 实现的安全性与功能正确性验证
          theme:
            palette:
              - media: '(prefers-color-scheme: light)'
                scheme: default
                primary: indigo
                accent: indigo
                toggle:
                  icon: material/weather-night
                  name: 切换到深色模式
              - media: '(prefers-color-scheme: dark)'
                scheme: slate
                primary: indigo
                accent: indigo
                toggle:
                  icon: material/weather-sunny
                  name: 切换到浅色模式
          nav_translations:
            Start here: 从这里开始
            Illustrated guide: 图解导读
            A complete task: 一次完整任务
            Repetition, codes and blocks: 重复、编码与数据块
            Streaming and saved state: 流式处理与保留状态
            Formats and integrity checks: 格式与完整性检查
            State operations: 状态操作
            Application interfaces: 应用接口
            Specifications: 精确规范
            Platform assumptions: 平台假设
            Safety: 安全性
            Input configurations: 输入配置
            API: API 契约
            Contract vocabulary: 契约术语
            Shared stream rules: 共用流规则
            Deflate: 压缩引擎（deflate）
            Inflate: 解压引擎（inflate）
            Callback decoding: 回调解压
            Buffer utilities: 整块缓冲区接口
            Checksums: 校验和
            Gzip files: gzip 文件
            Internal helper contracts: 内部辅助函数契约
            Data format: 数据格式
            Formal format relations: 形式化格式关系
            Model: 模型与假设
            Architecture: 架构
            Translation: C 翻译规则
            API models and refinement: API 模型与细化
            External I/O: 外部输入输出
            Trusted base: 可信基础
            Scope and limitations: 范围与限制
            Runtime field reference: 运行时字段参考
            Implementation arguments: 实现证明参考
            Method: 证明方法
            Decode tables: 解码表
            Fast decoder: 快速解码
            Trees and output storage: 编码树与输出存储
            Allocation and utilities: 分配与工具函数
            Callback decoder: 回调解码器
            Earlier arguments: 早期论证参考
            Progress and dependencies: 进度与依赖
            Checking: 检查与验收
            Fixed public goals: 固定公开目标
            Acceptance policy: 验收规则
            Proof mutations: 证明变异
            Review records: 审阅记录
            Contract review: 契约审阅
            Registration review: 登记审阅
            Query registration: 查询接口登记
            Integration review: 集成审阅
            Compiler helper review: 编译辅助声明审阅
            Runtime review: 运行时审阅
            Heap-table review: 堆表审阅
            Source findings: 源码发现
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      toc_depth: 2-3
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: diagram-source
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
  - assets/reading.css
extra_javascript:
  - path: assets/diagrams.js
    type: module
nav:
  - Start here: index.md
  - Illustrated guide:
      - A complete task: guide/round-trip.md
      - Repetition, codes and blocks: guide/encoding.md
      - Streaming and saved state: guide/streaming.md
      - Formats and integrity checks: guide/wrappers.md
      - State operations: guide/state-operations.md
      - Application interfaces: guide/interfaces.md
  - Specifications:
      - spec/README.md
      - Platform assumptions: spec/platform.md
      - Safety: spec/safety.md
      - Input configurations: spec/input-configurations.md
      - API:
          - spec/api/README.md
          - Contract vocabulary: spec/api/contracts.md
          - Shared stream rules: spec/api/streams.md
          - Deflate: spec/api/deflate-stream.md
          - Inflate: spec/api/inflate-stream.md
          - Callback decoding: spec/api/inflate-back.md
          - Buffer utilities: spec/api/utility.md
          - Checksums: spec/api/checksums.md
          - Gzip files: spec/api/gz-file.md
      - Internal helper contracts: spec/internal-contracts.md
      - Data format:
          - spec/format/README.md
          - Formal format relations: spec/format/model.md
  - Model:
      - design/README.md
      - Architecture: design/architecture.md
      - Translation: design/translation.md
      - API models and refinement: design/api-model.md
      - External I/O: design/external-io.md
      - Trusted base: trusted-base.md
      - Scope and limitations: deviations.md
      - Runtime field reference: runtime-schema.md
  - Implementation arguments:
      - proof/README.md
      - Method: proof/method.md
      - Inflate: proof/inflate.md
      - Decode tables: proof/inftrees.md
      - Fast decoder: proof/inffast.md
      - Deflate: proof/deflate.md
      - Trees and output storage: proof/trees.md
      - Adler-32: proof/adler32.md
      - CRC-32: proof/crc32.md
      - Allocation and utilities: proof/zutil.md
      - Callback decoder: proof/callbacks.md
      - Buffer utilities: proof/buffers.md
      - Gzip files: proof/gzip.md
      - Earlier arguments: proof/references.md
  - Progress and dependencies: progress.md
  - Checking:
      - checking/README.md
      - Fixed public goals: checking/goals.md
      - Acceptance policy: anti-cheating.md
      - Proof mutations: checking/proof-mutants.md
      - Review records:
          - Contract review: checking/contract-review.md
          - Registration review: checking/registration-review.md
          - Query registration: checking/query-registration-review.md
          - Integration review: checking/pr-integration-review.md
          - Compiler helper review: checking/compiler-helper-review.md
          - Runtime review: checking/runtime-review.md
          - Heap-table review: checking/runtime-tables-review.md
      - Source findings: findings.md

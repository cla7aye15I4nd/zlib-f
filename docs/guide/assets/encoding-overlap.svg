<svg xmlns="http://www.w3.org/2000/svg" width="660" height="646" viewBox="0 0 660 646" role="img" aria-labelledby="title desc">
  <title id="title">Overlapping match copy expands AB to ABABABAB</title>
  <desc id="desc">Seven rows show the initial AB followed by six sequential byte copies. Source indices 0 through 5 copy into destination indices 2 through 7. Newly produced bytes can supply later reads.</desc>

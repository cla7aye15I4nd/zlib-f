<svg width="900" height="540" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Three calls, one stream</title><desc id="desc">A valid zlib stored block contains ABABABAB. First supply nine input bytes, then eleven. Three output buffers emit AB, ABA and BAB. One extra EE input byte remains after stream completion.</desc>
<rect width="900" height="540" rx="12" fill="#f8fafc"/>
<style>text{font-family:Arial,sans-serif;fill:#172033} .title{font-size:24px;font-weight:700} .label{font-size:17px} .small{font-size:15px} .mono{font-family:monospace;font-size:18px} .strong{font-size:19px;font-weight:700}</style>
<text x="24" y="36" class="title">One stream, three small output buffers</text>
<text x="24" y="65" class="label">Full input: 19 stream bytes + 1 tail byte; output capacity = 3 each call</text>
<text x="65.0" y="98" text-anchor="middle" class="small">zlib</text>

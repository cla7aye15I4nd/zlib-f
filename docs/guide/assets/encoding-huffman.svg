<svg xmlns="http://www.w3.org/2000/svg" width="660" height="629" viewBox="0 0 660 629" role="img" aria-labelledby="title desc">
  <title id="title">Toy Huffman tree for four symbols</title>
  <desc id="desc">The example merges weights one and one, then two and two, then four and four. The leaf codes are A zero, B one zero, C one one zero, D one one one. ABAD encodes as 0100111.</desc>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#17243b;font-size:17px}.title{font-size:23px;font-weight:700}.small{font-size:14px}.mono{font-family:monospace;font-size:20px}.muted{fill:#607086}.label{font-size:16px;font-weight:700}</style>
  <rect width="660" height="629" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3c6394"/>
    </marker>
  </defs>
  <text x="24" y="36" class="title" text-anchor="start">Toy Huffman code: frequent symbols get shorter paths</text>
  <text x="24" y="65" class="small" text-anchor="start">Frequencies: A=4, B=2, C=1, D=1. Not DEFLATE wire codes.</text>
  <line x1="230" y1="134" x2="92" y2="201" stroke="#3c6394" stroke-width="2"/>
  <text x="171.0" y="168.5" class="label" text-anchor="start">0</text>
  <line x1="230" y1="134" x2="358" y2="201" stroke="#3c6394" stroke-width="2"/>
  <text x="304.0" y="168.5" class="label" text-anchor="start">1</text>
  <line x1="358" y1="247" x2="254" y2="311" stroke="#3c6394" stroke-width="2"/>
  <text x="316.0" y="280.0" class="label" text-anchor="start">0</text>
  <line x1="358" y1="247" x2="480" y2="311" stroke="#3c6394" stroke-width="2"/>
  <text x="429.0" y="280.0" class="label" text-anchor="start">1</text>
  <line x1="480" y1="357" x2="400" y2="421" stroke="#3c6394" stroke-width="2"/>
  <text x="450.0" y="390.0" class="label" text-anchor="start">0</text>
  <line x1="480" y1="357" x2="575" y2="421" stroke="#3c6394" stroke-width="2"/>
  <text x="537.5" y="390.0" class="label" text-anchor="start">1</text>
  <rect x="189" y="88" width="82" height="48" rx="12" fill="#f1f3f7" stroke="#6483a9" stroke-width="1.5"/>
  <text x="230" y="118" class="label" text-anchor="middle">8</text>
  <rect x="51" y="201" width="82" height="48" rx="12" fill="#e3efff" stroke="#6483a9" stroke-width="1.5"/>
  <text x="92" y="231" class="label" text-anchor="middle">A: 4</text>
  <rect x="317" y="201" width="82" height="48" rx="12" fill="#f1f3f7" stroke="#6483a9" stroke-width="1.5"/>
  <text x="358" y="231" class="label" text-anchor="middle">4</text>
  <rect x="213" y="311" width="82" height="48" rx="12" fill="#e3efff" stroke="#6483a9" stroke-width="1.5"/>
  <text x="254" y="341" class="label" text-anchor="middle">B: 2</text>
  <rect x="439" y="311" width="82" height="48" rx="12" fill="#f1f3f7" stroke="#6483a9" stroke-width="1.5"/>
  <text x="480" y="341" class="label" text-anchor="middle">2</text>
  <rect x="359" y="421" width="82" height="48" rx="12" fill="#e3efff" stroke="#6483a9" stroke-width="1.5"/>
  <text x="400" y="451" class="label" text-anchor="middle">C: 1</text>
  <rect x="534" y="421" width="82" height="48" rx="12" fill="#e3efff" stroke="#6483a9" stroke-width="1.5"/>
  <text x="575" y="451" class="label" text-anchor="middle">D: 1</text>
  <text x="92" y="270" class="mono" text-anchor="middle">0</text>
  <text x="254" y="380" class="mono" text-anchor="middle">10</text>
  <text x="400" y="490" class="mono" text-anchor="middle">110</text>
  <text x="575" y="490" class="mono" text-anchor="middle">111</text>
  <line x1="24" y1="511" x2="636" y2="511" stroke="#d5dce7" stroke-width="1"/>
  <text x="24" y="546" class="mono" text-anchor="start">Encode ABAD:   0 | 10 | 0 | 111 = 0100111</text>
  <text x="24" y="578" class="small" text-anchor="start">Decode: follow edges to a leaf, emit its symbol, return to the root.</text>
  <text x="24" y="606" class="small" text-anchor="start">Merge order: (C1 + D1) → 2; (B2 + 2) → 4; (A4 + 4) → 8.</text>
</svg>

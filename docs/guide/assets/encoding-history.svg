<svg xmlns="http://www.w3.org/2000/svg" width="660" height="555" viewBox="0 0 660 555" role="img" aria-labelledby="title desc">
  <title id="title">Saved history and an invalid backward reference</title>
  <desc id="desc">After 40000 bytes the most recent 32768 bytes have indices 7232 through 39999. A separate example with only AB and no dictionary cannot satisfy distance three because it requests index minus one.</desc>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#17243b;font-size:17px}.title{font-size:23px;font-weight:700}.small{font-size:14px}.mono{font-family:monospace;font-size:20px}.muted{fill:#607086}.label{font-size:16px;font-weight:700}</style>
  <rect width="660" height="555" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3c6394"/>
    </marker>
  </defs>
  <text x="24" y="37" class="title" text-anchor="start">History gives a distance its meaning</text>
  <text x="24" y="68" class="small" text-anchor="start">Example: 40,000 bytes produced; 32 KiB saved window; next index = 40,000.</text>
  <rect x="24" y="92" width="154" height="70" rx="5" fill="#f1f3f7" stroke="#c4cddb" stroke-width="1"/>
  <rect x="178" y="92" width="430" height="70" rx="5" fill="#e3efff" stroke="#2262a3" stroke-width="2"/>
  <text x="101" y="120" class="label" text-anchor="middle">Older output</text>
  <text x="101" y="145" class="mono" text-anchor="middle">0 … 7231</text>
  <text x="393" y="120" class="label" text-anchor="middle">Retained suffix: 32,768 bytes</text>
  <text x="393" y="145" class="mono" text-anchor="middle">7232 … 39999</text>
  <line x1="186" y1="196" x2="598" y2="196" stroke="#3c6394" stroke-width="2"/>
  <line x1="186" y1="188" x2="186" y2="204" stroke="#3c6394" stroke-width="2"/>
  <line x1="598" y1="188" x2="598" y2="204" stroke="#3c6394" stroke-width="2"/>
  <text x="392" y="221" class="label" text-anchor="middle">Distance 32,768 reaches index 7232.</text>
  <text x="392" y="248" class="label" text-anchor="middle">Distance 1 reaches index 39999.</text>
  <line x1="24" y1="278" x2="636" y2="278" stroke="#d5dce7" stroke-width="1"/>
  <text x="24" y="313" class="label" text-anchor="start">Separate invalid example: no dictionary; only AB has been produced.</text>
  <rect x="116" y="343" width="88" height="50" rx="5" fill="#fff1ed" stroke="#c4cddb" stroke-width="1"/>
  <text x="160" y="375" class="mono" text-anchor="middle">?</text>
  <rect x="224" y="343" width="88" height="50" rx="5" fill="#e3efff" stroke="#c4cddb" stroke-width="1"/>
  <text x="268" y="375" class="mono" text-anchor="middle">A</text>
  <rect x="332" y="343" width="88" height="50" rx="5" fill="#e3efff" stroke="#c4cddb" stroke-width="1"/>
  <text x="376" y="375" class="mono" text-anchor="middle">B</text>
  <rect x="440" y="343" width="88" height="50" rx="5" fill="#f1f3f7" stroke="#c4cddb" stroke-width="1"/>
  <text x="484" y="375" class="mono" text-anchor="middle">next</text>
  <text x="160" y="421" class="small" text-anchor="middle">index −1</text>
  <text x="268" y="421" class="small" text-anchor="middle">index 0</text>
  <text x="376" y="421" class="small" text-anchor="middle">index 1</text>
  <text x="484" y="421" class="small" text-anchor="middle">index 2</text>
  <path d="M484,440 Q322,493 160,440" fill="none" stroke="#3c6394" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="322" y="502" class="label" text-anchor="middle">distance 3 asks for index −1: refuse before reading</text>
  <text x="24" y="535" class="small" text-anchor="start">Top panel: blue = saved history. Bottom panel: red = nonexistent history.</text>
</svg>

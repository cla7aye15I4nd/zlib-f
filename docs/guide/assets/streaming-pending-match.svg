<svg width="900" height="420" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">One match spans two output buffers</title><desc id="desc">After AB, a length-six distance-two match first writes ABA into three output slots. The decoder retains a remaining length of three and later writes BAB into fresh output space. This is a conceptual pending-match example, not a compressed input byte trace.</desc>
<rect width="900" height="420" rx="12" fill="#f8fafc"/>
<style>text{font-family:Arial,sans-serif;fill:#172033} .title{font-size:24px;font-weight:700} .label{font-size:17px} .small{font-size:15px} .mono{font-family:monospace;font-size:18px} .strong{font-size:19px;font-weight:700}</style>
<text x="24" y="36" class="title">Pause inside a single length / distance match</text>
<text x="24" y="65" class="label">Abstract match state: original prefix AB; distance = 2; length = 6</text>
<text x="24" y="128" class="strong">Before</text>
<rect x="132" y="103" width="38" height="36" rx="6" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="144" y="128" class="mono">A</text>
<rect x="174" y="103" width="38" height="36" rx="6" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="186" y="128" class="mono">B</text>
<text x="500" y="126" class="mono">remaining length = 6</text>
<text x="132" y="169" class="label">Blue: existing history. Amber: bytes produced by this match.</text>
<text x="500" y="156" class="small">distance remains 2</text>
<text x="24" y="236" class="strong">Pause</text>
<rect x="132" y="211" width="38" height="36" rx="6" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="144" y="236" class="mono">A</text>
<rect x="174" y="211" width="38" height="36" rx="6" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="186" y="236" class="mono">B</text>
<rect x="216" y="211" width="38" height="36" rx="6" fill="#ffedd5" stroke="#cbd5e1"/>
<text x="228" y="236" class="mono">A</text>
<rect x="258" y="211" width="38" height="36" rx="6" fill="#ffedd5" stroke="#cbd5e1"/>
<text x="270" y="236" class="mono">B</text>
<rect x="300" y="211" width="38" height="36" rx="6" fill="#ffedd5" stroke="#cbd5e1"/>
<text x="312" y="236" class="mono">A</text>
<text x="500" y="234" class="mono">remaining length = 3</text>
<text x="132" y="277" class="label">Current buffer receives ABA; previously delivered prefix stays in history.</text>
<text x="500" y="264" class="small">distance remains 2</text>
<text x="24" y="344" class="strong">Resume</text>
<rect x="132" y="319" width="38" height="36" rx="6" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="144" y="344" class="mono">A</text>
<rect x="174" y="319" width="38" height="36" rx="6" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="186" y="344" class="mono">B</text>
<rect x="216" y="319" width="38" height="36" rx="6" fill="#ffedd5" stroke="#cbd5e1"/>
<text x="228" y="344" class="mono">A</text>
<rect x="258" y="319" width="38" height="36" rx="6" fill="#ffedd5" stroke="#cbd5e1"/>
<text x="270" y="344" class="mono">B</text>
<rect x="300" y="319" width="38" height="36" rx="6" fill="#ffedd5" stroke="#cbd5e1"/>
<text x="312" y="344" class="mono">A</text>
<rect x="342" y="319" width="38" height="36" rx="6" fill="#ffedd5" stroke="#cbd5e1"/>
<text x="354" y="344" class="mono">B</text>
<rect x="384" y="319" width="38" height="36" rx="6" fill="#ffedd5" stroke="#cbd5e1"/>
<text x="396" y="344" class="mono">A</text>
<rect x="426" y="319" width="38" height="36" rx="6" fill="#ffedd5" stroke="#cbd5e1"/>
<text x="438" y="344" class="mono">B</text>
<text x="500" y="342" class="mono">remaining length = 0</text>
<text x="132" y="385" class="label">Current buffer receives BAB; previously delivered prefix stays in history.</text>
</svg>

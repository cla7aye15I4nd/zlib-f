<svg width="880" height="392" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" role="img" aria-labelledby="title desc">
  <title id="title">One valid encoding of eight bytes</title>
  <desc id="desc">The original bytes 41 42 41 42 41 42 41 42 are encoded as the twelve-byte zlib stream 78 9c 73 74 72 04 43 00 09 3c 02 0d, then decoded to the original eight bytes. The header, DEFLATE body and trailer have distinct labeled backgrounds.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  </defs>
  <rect width="880" height="392" rx="12" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#172554">
    <text x="24" y="33" font-size="20" font-weight="bold">Same data, a different representation</text>
    <text x="24" y="75" font-size="16">Original</text>
    <text x="24" y="97" font-size="14">8 bytes</text>
    <text x="24" y="202" font-size="16">Encoded</text>
    <text x="24" y="224" font-size="14">12 bytes</text>
    <text x="24" y="316" font-size="16">Recovered</text>
    <text x="24" y="338" font-size="14">8 bytes</text>
  </g>
  <g stroke="#94a3b8" fill="#ffffff">
    <path d="M164 56 H660 V104 H164 Z M226 56 V104 M288 56 V104 M350 56 V104 M412 56 V104 M474 56 V104 M536 56 V104 M598 56 V104"/>
    <path d="M164 294 H660 V342 H164 Z M226 294 V342 M288 294 V342 M350 294 V342 M412 294 V342 M474 294 V342 M536 294 V342 M598 294 V342"/>
  </g>
  <g font-family="monospace" font-size="20" text-anchor="middle" fill="#0f172a">
    <text y="86"><tspan x="195">41</tspan><tspan x="257">42</tspan><tspan x="319">41</tspan><tspan x="381">42</tspan><tspan x="443">41</tspan><tspan x="505">42</tspan><tspan x="567">41</tspan><tspan x="629">42</tspan></text>
    <text y="324"><tspan x="195">41</tspan><tspan x="257">42</tspan><tspan x="319">41</tspan><tspan x="381">42</tspan><tspan x="443">41</tspan><tspan x="505">42</tspan><tspan x="567">41</tspan><tspan x="629">42</tspan></text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M412 113 V154"/>
    <path d="M412 242 V281"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#334155">
    <text x="430" y="139">encode</text>
    <text x="430" y="268">decode</text>
  </g>
  <g stroke="#94a3b8">
    <rect x="164" y="181" width="104" height="48" fill="#dbeafe"/>
    <rect x="268" y="181" width="312" height="48" fill="#e0f2fe"/>
    <rect x="580" y="181" width="208" height="48" fill="#fef3c7"/>
    <path d="M216 181 V229 M320 181 V229 M372 181 V229 M424 181 V229 M476 181 V229 M528 181 V229 M632 181 V229 M684 181 V229 M736 181 V229" fill="none"/>
  </g>
  <g font-family="monospace" font-size="19" text-anchor="middle" fill="#0f172a">
    <text y="211"><tspan x="190">78</tspan><tspan x="242">9c</tspan><tspan x="294">73</tspan><tspan x="346">74</tspan><tspan x="398">72</tspan><tspan x="450">04</tspan><tspan x="502">43</tspan><tspan x="554">00</tspan><tspan x="606">09</tspan><tspan x="658">3c</tspan><tspan x="710">02</tspan><tspan x="762">0d</tspan></text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#334155">
    <text x="216" y="171">zlib header</text>
    <text x="424" y="171">DEFLATE body</text>
    <text x="684" y="171">Adler-32 trailer</text>
    <text x="440" y="374">Hexadecimal byte values. Colors identify format regions, not proof status.</text>

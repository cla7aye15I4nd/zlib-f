<svg width="960" height="420" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">同一个 DEFLATE 存储块的三种格式</title>
  <desc id="desc">各行都携带八字节 01 03 00 fc ff 41 42 43，表示 ABC 的最终存储块。裸格式没有包装。zlib 添加头部 78 01 和 Adler 尾部 01 8d 00 c7。gzip 添加十字节头部和尾部 48 03 83 a3 03 00 00 00。蓝色为主体，灰色为元数据，琥珀色为尾部。</desc>
  <rect width="960" height="420" rx="12" fill="#ffffff"/>
  <style>
    text { font-family: sans-serif; fill: #172b4d; }
    .label { font-size: 19px; font-weight: 600; }
    .small { font-size: 16px; }
    .bytes { font-family: monospace; font-size: 16px; }
    .header { fill: #edf1f5; stroke: #8a99aa; }
    .body { fill: #e1efff; stroke: #3978b8; }
    .trailer { fill: #fff0cc; stroke: #b27b14; }
  </style>
  <text x="26" y="31" class="label">三个 ASCII 字节 ABC 的一种编码</text>
  <text x="26" y="57" class="small">每个蓝框都是同一个最终存储块。框宽为示意。</text>

  <text x="26" y="91" class="label">裸 DEFLATE</text>
  <rect x="250" y="105" width="420" height="65" rx="7" class="body"/>
  <text x="270" y="131" class="small">DEFLATE 主体</text>
  <text x="270" y="155" class="bytes">01 03 00 fc ff 41 42 43</text>
  <text x="26" y="142" class="small">无包装头部</text>
  <text x="696" y="142" class="small">无包装尾部</text>

  <text x="26" y="200" class="label">zlib 格式</text>
  <rect x="26" y="213" width="210" height="65" rx="7" class="header"/>
  <text x="42" y="239" class="small">头部</text>
  <text x="42" y="263" class="bytes">78 01</text>
  <rect x="250" y="213" width="420" height="65" rx="7" class="body"/>
  <text x="270" y="239" class="small">相同的 DEFLATE 主体</text>
  <text x="270" y="263" class="bytes">01 03 00 fc ff 41 42 43</text>
  <rect x="684" y="213" width="250" height="65" rx="7" class="trailer"/>
  <text x="700" y="239" class="small">ABC 的 Adler-32</text>
  <text x="700" y="263" class="bytes">01 8d 00 c7</text>

  <text x="26" y="308" class="label">gzip 成员</text>
  <rect x="26" y="320" width="210" height="78" rx="7" class="header"/>
  <text x="42" y="342" class="small">最小头部</text>
  <text x="42" y="365" class="bytes">1f 8b 08 00 00</text>
  <text x="42" y="387" class="bytes">00 00 00 00 ff</text>
  <rect x="250" y="320" width="420" height="78" rx="7" class="body"/>
  <text x="270" y="350" class="small">相同的 DEFLATE 主体</text>
  <text x="270" y="378" class="bytes">01 03 00 fc ff 41 42 43</text>
  <rect x="684" y="320" width="250" height="78" rx="7" class="trailer"/>
  <text x="700" y="342" class="small">ABC 的 CRC-32／大小</text>
  <text x="700" y="365" class="bytes">48 03 83 a3</text>
  <text x="700" y="387" class="bytes">03 00 00 00</text>
</svg>
